name: workers
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}    
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  pg-admin:
    image: dpage/pgadmin4
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS}
              
    ports:
      - "5050:80"

    depends_on:
      db:
        condition: service_healthy
  api:
    image: job_board_api
    build:
      context: .
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  web:
    image: job_board_front
    build:
      context: ../frontend
    ports:
      - "5173:80"
  migrations:
    environment:
      - DB_URL=postgresql+asyncpg://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}?async_fallback=True
    build: .
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
volumes:
   postgres_data:

